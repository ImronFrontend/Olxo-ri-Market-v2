<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FakeStore</title>
    <link rel="stylesheet" href="./css/welcome.css" />
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <ul>
                <li><a href="#">Products</a></li>
                <li><a href="#">Users</a></li>
                <li><a href="#" class="caps">Carts</a></li>
            </ul>
        </div>


        <div class="content">
            <h1>Products Management</h1>
            
            <section class="add-product-section">
                <h2>Add New Product</h2>
                <form id="add-product-form" class="product-form"> 
                    <div class="form-group">
                        <input type="text" id="title" name="title" placeholder="Product Title" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="price" name="price" step="0.01" placeholder="Price" required>
                    </div>
                    <div class="form-group">
                        <input type="url" id="image" name="image" placeholder="Image URL (e.g. https://...)" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="category" name="category" placeholder="Category" required>
                    </div>
                    <div class="form-group">
                        <textarea id="description" name="description" placeholder="Description" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="reset" class="btn-secondary">Clear</button>
                        <button type="submit" class="btn-primary">Add Product</button>
                    </div>
                </form>
            </section>

            <table class="product-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                </tbody>
            </table>

            <div class="edit-modal hidden">
                <form class="edit-form">
                    <input type="text" placeholder="Url" name="image">
                    <input type="text" placeholder="Title" name="title">
                    <input type="text" placeholder="Price" name="price">
                    <input type="text" placeholder="Category" name="category">
                    <input type="text" placeholder="Description" name="description">
                    <div>
                        <button type="submit">Update</button>
                        <button type="button" class="back">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/products.js"></script>
</body>
</html>
